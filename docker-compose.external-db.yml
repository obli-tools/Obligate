# Use this compose file if you already have PostgreSQL running (e.g. on Unraid).
# Usage: docker compose -f docker-compose.external-db.yml up -d
#
# Required .env variables:
#   DATABASE_URL=postgres://obligate:<password>@<host>:5432/obligate
#   SESSION_SECRET=<random-string>

services:
  server:
    image: meejay/obligate-server:${OBLIGATE_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OAUTH_EXTRA_REDIRECT_ORIGINS: ${OAUTH_EXTRA_REDIRECT_ORIGINS:-}
      OAUTH_LOOPBACK_APP_TYPES: ${OAUTH_LOOPBACK_APP_TYPES:-}
      DELEGATION_ALLOW_ADMIN_SUBJECTS: ${DELEGATION_ALLOW_ADMIN_SUBJECTS:-}
      OAUTH_LOT_O_CAPABILITIES: ${OAUTH_LOT_O_CAPABILITIES:-}
      DELEGATION_APP_SUBJECT_PAIRS: ${DELEGATION_APP_SUBJECT_PAIRS:-}
      DELEGATION_ALLOW_EXPOSED_KEYS: ${DELEGATION_ALLOW_EXPOSED_KEYS:-}
      OAUTH_ACCEPT_RAW_CLIENT_ID: ${OAUTH_ACCEPT_RAW_CLIENT_ID:-}
      INBOUND_SECRET_APP_TYPES: ${INBOUND_SECRET_APP_TYPES:-}

  client:
    image: meejay/obligate-client:${OBLIGATE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-3020}:80"
